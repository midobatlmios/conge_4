<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#C71618">
    <title>Hors connexion</title>
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
               font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #fff; color: #171717; text-align: center; }
        main { max-width: 360px; }
        img { width: 72px; height: 72px; }
        h1 { font-size: 1.25rem; margin: 16px 0 8px; }
        p { color: #525252; line-height: 1.5; margin: 0 0 8px; }
        button { margin-top: 16px; padding: 10px 20px; border: 0; border-radius: 8px; background: #C71618; color: #fff; font-size: 1rem; cursor: pointer; }
        @media (prefers-color-scheme: dark) { body { background: #0a0a0a; color: #fafafa; } p { color: #a3a3a3; } }
    </style>
</head>
<body>
    <main>
        <img src="/icons/icon-192.png" alt="">
        <h1>Pas de connexion</h1>
        <p>Vérifiez votre connexion Internet, puis réessayez.</p>
        <p dir="rtl" lang="ar">لا يوجد اتصال بالإنترنت. تحقق من الاتصال ثم أعد المحاولة.</p>
        <p lang="en">No internet connection. Check it and try again.</p>
        <button type="button" onclick="location.reload()">Réessayer</button>
    </main>
</body>
</html>
